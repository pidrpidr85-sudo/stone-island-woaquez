<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101110">
  <title>WOAQUEZ · Избранное</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#101110;--panel:#1a1c1a;--muted:#929891;--line:#303530;--text:#f2f4ef;--accent:#b9d36b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .brand{font-size:12px;letter-spacing:.24em;color:var(--accent);font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:5px}
    h1{font-size:27px;letter-spacing:-.04em;margin:8px 0 4px}.count{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 10px}
    .search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:13px 14px;font-size:14px;outline:none;margin:12px 0 18px}
    #list{display:grid;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
    .photo{width:100%;height:210px;object-fit:cover;background:#252925;display:block}.body{padding:13px}.title{font-weight:650;line-height:1.35;font-size:15px}.meta{color:var(--muted);font-size:13px;margin-top:8px}.price{color:var(--accent);font-weight:750;margin-top:8px}
    .actions{display:flex;gap:8px;margin-top:13px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:11px 8px;font-size:13px;font-weight:650;background:#252925;color:var(--text)}
    .actions .remove{color:#ffaaa4}.empty{border:1px dashed var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted);line-height:1.5}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:8px}
    footer{text-align:center;color:#697068;font-size:11px;margin-top:22px;letter-spacing:.08em}
  </style>
</head>
<body>
  <header><div><div class="brand">WOAQUEZ</div><div class="sub">FINDER · YOUR COLLECTION</div></div><div class="count" id="count">0 сохранено</div></header>
  <h1>Избранное</h1>
  <div class="sub">Объявления, которые ты сохранил на Kufar</div>
  <input id="filter" class="search" type="search" placeholder="Поиск по сохранённым объявлениям…">
  <main id="list"><div class="empty">Загружаю избранное…</div></main>
  <footer>WOAQUEZ FINDER</footer>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#101110"); tg.setBackgroundColor("#101110"); } catch (_) {} }
  const cloud = tg && tg.CloudStorage;
  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const filter = document.getElementById("filter");
  let items = [];

  const cloudCall = (method, ...args) => new Promise((resolve, reject) => {
    if (!cloud || typeof cloud[method] !== "function") return reject(new Error("CloudStorage недоступно"));
    cloud[method](...args, (error, result) => error ? reject(error) : resolve(result));
  });
  const readAll = async () => {
    try {
      const keys = await cloudCall("getKeys");
      if (!keys.length) return [];
      const values = await cloudCall("getItems", keys);
      return keys.map(key => { try { return JSON.parse(values[key]); } catch (_) { return null; } }).filter(Boolean);
    } catch (_) {
      try { return JSON.parse(localStorage.getItem("woaquez_favorites") || "[]"); } catch (_) { return []; }
    }
  };
  const writeOne = async item => {
    const key = "fav_" + item.id;
    try {
      const exists = await cloudCall("getItem", key);
      if (!exists) await cloudCall("setItem", key, JSON.stringify(item));
    } catch (_) {
      const old = JSON.parse(localStorage.getItem("woaquez_favorites") || "[]");
      if (!old.some(x => x.id === item.id)) old.unshift(item);
      localStorage.setItem("woaquez_favorites", JSON.stringify(old));
    }
  };
  const removeOne = async id => {
    try { await cloudCall("removeItem", "fav_" + id); }
    catch (_) {
      const old = JSON.parse(localStorage.getItem("woaquez_favorites") || "[]").filter(x => x.id !== id);
      localStorage.setItem("woaquez_favorites", JSON.stringify(old));
    }
    items = items.filter(x => x.id !== id); render();
  };
  const escapeHtml = value => String(value || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const render = () => {
    const q = filter.value.trim().toLowerCase();
    const shown = items.filter(x => (x.title + " " + x.city + " " + x.price).toLowerCase().includes(q));
    count.textContent = items.length + " сохранено";
    if (!shown.length) {
      list.innerHTML = '<div class="empty"><strong>' + (items.length ? "Ничего не найдено" : "Пока здесь пусто") + '</strong>' + (items.length ? "Попробуй изменить запрос." : "Нажимай 🏝️ «В избранное» на карточках Kufar — объявления появятся здесь.") + '</div>';
      return;
    }
    list.innerHTML = shown.map(x => '<article class="card">' +
      (x.image ? '<img class="photo" src="' + escapeHtml(x.image) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<div class="body"><div class="title">' + escapeHtml(x.title) + '</div>' +
      '<div class="meta">📍 ' + escapeHtml(x.city || "Город не указан") + '</div>' +
      '<div class="price"> ' + escapeHtml(x.price || "Цена не указана") + '</div>' +
      '<div class="actions"><a href="' + escapeHtml(x.link) + '" target="_blank" rel="noopener">Открыть Kufar ↗</a>' +
      '<button class="remove" data-remove="' + escapeHtml(x.id) + '">Убрать ✕</button></div></div></article>').join("");
    list.querySelectorAll("[data-remove]").forEach(button => button.addEventListener("click", () => removeOne(button.dataset.remove)));
  };
  const params = new URLSearchParams(location.search);
  const id = params.get("save");
  (async () => {
    items = await readAll();
    if (id && /^\d+$/.test(id)) {
      const item = {id, title:params.get("title") || "Объявление Kufar", city:params.get("city") || "Город не указан", price:params.get("price") || "Цена не указана", link:params.get("link") || ("https://www.kufar.by/item/" + id), image:params.get("image") || ""};
      if (/^https:\/\/www\.kufar\.by\/item\/\d+$/.test(item.link)) {
        await writeOne(item);
        items = await readAll();
        const notice = document.createElement("div");
        notice.className = "sub"; notice.style.color = "var(--accent)"; notice.style.margin = "0 0 12px";
        notice.textContent = "✓ Объявление добавлено в избранное";
        list.before(notice);
      }
      history.replaceState({}, "", location.pathname);
    }
    render();
  })();
  filter.addEventListener("input", render);
})();
</script>
</body>
</html>
