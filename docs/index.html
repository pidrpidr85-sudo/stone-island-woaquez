<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0b">
  <title>WOAQUEZ · Избранное</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
:root{color-scheme:light;--bg:#f2f2f7;--panel:rgba(255,255,255,.84);--text:#17171b;--muted:#85858d;--accent:#007aff;--danger:#ff3b30}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#e9edf4 0,#f2f2f7 260px);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));letter-spacing:-.015em}
.shell{max-width:620px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 3px 20px}
.brand{font-size:15px;font-weight:850;letter-spacing:.19em;color:#17171b}.brand-sub{font-size:9px;letter-spacing:.15em;color:#8b8b93;margin-top:4px;font-weight:700}
.status{border:1px solid rgba(0,122,255,.15);background:rgba(0,122,255,.08);color:var(--accent);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:750}
.hero{padding:24px 2px 18px}.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--accent);font-weight:800}
h1{font-size:38px;line-height:1.04;margin:9px 0 8px;letter-spacing:-.065em;font-weight:800}
.intro{color:#777780;font-size:14px;line-height:1.45;max-width:420px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin:17px 0 19px}.search-wrap{position:relative}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#8e8e95;font-size:18px;pointer-events:none}
.search{width:100%;height:46px;border:1px solid rgba(60,60,67,.08);background:rgba(255,255,255,.82);color:var(--text);border-radius:14px;padding:0 13px 0 40px;font-size:14px;outline:none;box-shadow:0 2px 8px rgba(20,30,50,.035);backdrop-filter:blur(18px)}
.search:focus,.sort:focus{border-color:rgba(0,122,255,.55);box-shadow:0 0 0 3px rgba(0,122,255,.1)}.search::placeholder{color:#a0a0a7}
.sort{height:46px;max-width:145px;border:1px solid rgba(60,60,67,.08);background:rgba(255,255,255,.82);color:#33333a;border-radius:14px;padding:0 11px;font-size:12px;outline:none}
.section-line{display:flex;align-items:center;justify-content:space-between;margin:0 3px 10px;color:#777780;font-size:11px;font-weight:750;letter-spacing:.055em;text-transform:uppercase}
#count{color:var(--accent);font-weight:800;letter-spacing:0;text-transform:none}#list{display:grid;grid-template-columns:1fr;gap:11px}
.card{display:grid;grid-template-columns:112px minmax(0,1fr);min-height:138px;background:var(--panel);border:1px solid rgba(255,255,255,.85);border-radius:20px;overflow:hidden;box-shadow:0 5px 18px rgba(25,35,55,.055);backdrop-filter:blur(20px)}
.photo{width:112px;height:100%;min-height:138px;max-height:190px;object-fit:cover;background:#e4e6eb;display:block}
.photo-placeholder{width:112px;min-height:138px;display:grid;place-items:center;background:linear-gradient(145deg,#e8ebf1,#dce1e9);color:#8793a5;font-size:27px}
.body{padding:13px 12px;min-width:0;display:flex;flex-direction:column}.title{font-weight:700;line-height:1.35;font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:#85858d;font-size:11px;margin-top:7px}.price{color:#17171b;font-size:16px;font-weight:850;margin-top:7px;letter-spacing:-.035em}
.actions{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:10px}
.actions a,.actions button{min-height:34px;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;border:1px solid rgba(60,60,67,.1);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:750;background:#f2f2f7;color:#33333a}
.actions a{flex:1;background:var(--accent);border-color:var(--accent);color:white;box-shadow:0 2px 5px rgba(0,122,255,.18)}
.actions .remove{color:var(--danger);background:rgba(255,59,48,.055);border-color:rgba(255,59,48,.1)}
.empty{border:1px solid rgba(255,255,255,.9);border-radius:21px;padding:37px 20px;text-align:center;color:#85858d;line-height:1.55;background:rgba(255,255,255,.72);box-shadow:0 5px 18px rgba(25,35,55,.04);backdrop-filter:blur(18px)}
.empty-mark{font-size:32px;margin-bottom:12px}.empty strong{display:block;color:#17171b;font-size:17px;margin-bottom:7px;letter-spacing:-.03em}
.empty small{display:block;margin-top:14px;color:#a0a0a7;font-size:10px;letter-spacing:.1em}
.toast{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:5;margin:0 0 12px;padding:12px 14px;border:1px solid rgba(52,199,89,.2);border-radius:13px;background:rgba(232,250,238,.94);color:#248a43;font-size:12px;font-weight:700;box-shadow:0 5px 15px rgba(20,50,30,.06);backdrop-filter:blur(16px)}
footer{text-align:center;color:#a0a0a7;font-size:9px;margin-top:27px;letter-spacing:.17em;font-weight:700}
@media(min-width:560px){body{padding-left:22px;padding-right:22px}.card{grid-template-columns:145px minmax(0,1fr);min-height:160px}.photo,.photo-placeholder{width:145px;min-height:160px}.body{padding:16px}.title{font-size:14px}.actions a,.actions button{font-size:12px}}
@media(max-width:360px){.card{grid-template-columns:94px minmax(0,1fr)}.photo,.photo-placeholder{width:94px}.body{padding:10px}.sort{max-width:112px}h1{font-size:34px}}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#000;--panel:rgba(28,28,30,.92);--text:#f5f5f7;--accent:#0a84ff;--danger:#ff453a}body{background:linear-gradient(180deg,#17191e 0,#000 300px);color:var(--text)}.brand,.price,.empty strong{color:#f5f5f7}.brand-sub,.intro,.section-line,.meta{color:#98989f}.status{background:rgba(10,132,255,.15);border-color:rgba(10,132,255,.25);color:#64b5ff}.search,.sort{background:rgba(44,44,46,.9);border-color:rgba(84,84,88,.45);color:#f5f5f7}.card{background:rgba(28,28,30,.92);border-color:rgba(84,84,88,.35)}.photo-placeholder{background:linear-gradient(145deg,#343438,#222226);color:#92929a}.actions a{background:#0a84ff;border-color:#0a84ff}.actions button{background:#2c2c2e;color:#e5e5ea;border-color:#48484a}.actions .remove{color:#ff6961;background:rgba(255,69,58,.12);border-color:rgba(255,69,58,.2)}.empty{background:rgba(28,28,30,.9);border-color:rgba(84,84,88,.35)}.empty strong{color:#f5f5f7}.empty small,footer{color:#77777e}.toast{background:rgba(27,58,37,.95);border-color:rgba(48,209,88,.25);color:#75df91}}
</style>
</head>
<body>
  <div class="shell">
    <header>
      <div><div class="brand">WOAQUEZ</div><div class="brand-sub">FINDER · PRIVATE COLLECTION</div></div>
      <div class="status">● LIVE COLLECTION</div>
    </header>
    <section class="hero">
      <div class="eyebrow">WOAQUEZ COMMUNITY</div>
      <h1 id="pageTitle">Избранное<span style="color:var(--accent)">.</span></h1>
      <div class="intro" id="pageIntro">Твоя личная коллекция сохранённых объявлений.</div>
    </section>
    <section id="favoritesPanel" class="panel">
    <div class="toolbar">
      <div class="search-wrap"><span class="search-icon">⌕</span><input id="filter" class="search" type="search" placeholder="Найти в избранном…" autocomplete="off"></div>
      <select id="sort" class="sort" aria-label="Сортировка"><option value="new">Сначала новые</option><option value="old">Сначала старые</option><option value="az">По названию</option></select>
    </div>
    <div class="section-line"><span>Сохранённые объявления</span><span id="count">0 / 0</span></div>
    <div id="notice" hidden></div>
    <main id="list"><div class="empty"><div class="empty-mark">🏝️</div><strong>Собираем твою коллекцию</strong>Загружаю сохранённые объявления…</div></main>
    </section>
    <footer>WOAQUEZ FINDER · EST. 2026</footer>
  </div>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0b0d0b"); tg.setBackgroundColor("#0b0d0b"); } catch (_) {} }
  const cloud = tg && tg.CloudStorage;
  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const filter = document.getElementById("filter");
  const sort = document.getElementById("sort");
  const notice = document.getElementById("notice");
  let items = [];
  const cloudCall = (method, ...args) => new Promise((resolve, reject) => {
    if (!cloud || typeof cloud[method] !== "function") return reject(new Error("CloudStorage недоступно"));
    cloud[method](...args, (error, result) => error ? reject(error) : resolve(result));
  });
  const readAll = async () => {
    try {
      const keys = (await cloudCall("getKeys")).filter(key => key.startsWith("fav_"));
      if (!keys.length) return [];
      const values = await cloudCall("getItems", keys);
      return keys.map(key => { try { return JSON.parse(values[key]); } catch (_) { return null; } }).filter(Boolean);
    } catch (_) {
      try { return JSON.parse(localStorage.getItem("woaquez_favorites") || "[]"); } catch (_) { return []; }
    }
  };
  const writeOne = async item => {
    const key = "fav_" + item.id;
    try {
      const exists = await cloudCall("getItem", key);
      if (!exists) await cloudCall("setItem", key, JSON.stringify(item));
    } catch (_) {
      const old = JSON.parse(localStorage.getItem("woaquez_favorites") || "[]");
      if (!old.some(x => x.id === item.id)) old.unshift(item);
      localStorage.setItem("woaquez_favorites", JSON.stringify(old));
    }
  };
  const removeOne = async id => {
    try { await cloudCall("removeItem", "fav_" + id); }
    catch (_) {
      const old = JSON.parse(localStorage.getItem("woaquez_favorites") || "[]").filter(x => String(x.id) !== String(id));
      localStorage.setItem("woaquez_favorites", JSON.stringify(old));
    }
    items = items.filter(x => String(x.id) !== String(id));
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); } catch (_) {}
    render();
  };
  const esc = value => String(value || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const showNotice = message => {
    notice.hidden = false;
    notice.className = "toast";
    notice.textContent = message;
  };
  const render = () => {
    const q = filter.value.trim().toLowerCase();
    const shown = items.filter(x => [x.title,x.city,x.price].join(" ").toLowerCase().includes(q));
    if (sort.value === "az") shown.sort((a,b) => String(a.title).localeCompare(String(b.title),"ru"));
    else shown.sort((a,b) => sort.value === "new" ? (Number(b.savedAt)||0) - (Number(a.savedAt)||0) : (Number(a.savedAt)||0) - (Number(b.savedAt)||0));
    count.textContent = q ? shown.length + " из " + items.length : items.length + (items.length === 1 ? " сохранено" : " сохранено");
    if (!shown.length) {
      list.innerHTML = '<div class="empty"><div class="empty-mark">' + (items.length ? "⌕" : "🏝️") + '</div><strong>' + (items.length ? "Ничего не найдено" : "Здесь пока пусто") + '</strong>' + (items.length ? "Попробуй другой запрос." : "Нажимай «🏝️ В избранное» на карточках Kufar — они появятся здесь.") + '<small>WOAQUEZ · YOUR FINDS, YOUR RULES</small></div>';
      return;
    }
    list.innerHTML = shown.map(x => '<article class="card">' +
      (x.image ? '<img class="photo" src="' + esc(x.image) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;photo-placeholder&quot;>🏝️</div>\'">' : '<div class="photo-placeholder">🏝️</div>') +
      '<div class="body"><div class="title">' + esc(x.title || "Объявление Kufar") + '</div>' +
      '<div class="meta">📍 ' + esc(x.city || "Город не указан") + '</div>' +
      '<div class="price">' + esc(x.price || "Цена не указана") + '</div>' +
      '<div class="actions"><a href="' + esc(x.link) + '" target="_blank" rel="noopener noreferrer">Открыть Kufar ↗</a>' +
      '<button class="remove" data-remove="' + esc(x.id) + '" aria-label="Удалить из избранного">Убрать ×</button></div></div></article>').join("");
    list.querySelectorAll("[data-remove]").forEach(button => button.addEventListener("click", () => removeOne(button.dataset.remove)));
  };

  const profileKey = "woaquez_profile";
  let profile = {xp:0, playedDay:"", gamesToday:0};
  const getProfile = async () => {
    try {
      const raw = await cloudCall("getItem", profileKey);
      if (raw) return {...profile, ...JSON.parse(raw)};
    } catch (_) {}
    try { return {...profile, ...JSON.parse(localStorage.getItem(profileKey) || "{}")}; } catch (_) { return profile; }
  };
  const saveProfile = async () => {
    const raw = JSON.stringify(profile);
    try { await cloudCall("setItem", profileKey, raw); }
    catch (_) { localStorage.setItem(profileKey, raw); }
  };
  const levels = [
    {name:"Новичок",icon:"🌱",min:0,desc:"Твоя история WOAQUEZ начинается здесь."},
    {name:"Искатель",icon:"🧭",min:50,desc:"Ты уже знаешь, где искать хорошие находки."},
    {name:"Коллекционер",icon:"🏝️",min:150,desc:"Твоя коллекция набирает характер."},
    {name:"Легенда",icon:"👑",min:350,desc:"Высший ранг сообщества WOAQUEZ."}
  ];
  const perks = [
    {icon:"🏷️",name:"Титул профиля",desc:"Открывается на уровне «Искатель».",min:50},
    {icon:"🔎",name:"Расширенный поиск в избранном",desc:"Открывается на уровне «Коллекционер».",min:150},
    {icon:"🎨",name:"Особый акцент профиля",desc:"Открывается на уровне «Легенда».",min:350},
    {icon:"🏆",name:"Значок WOAQUEZ",desc:"Играй и собирай опыт, чтобы открыть значок.",min:100}
  ];
  const isFounder = !!(tg && tg.initDataUnsafe && tg.initDataUnsafe.user &&
    String(tg.initDataUnsafe.user.username || "").toLowerCase() === "woaquez");
  const updatePerks = () => {
    const level = [...levels].reverse().find(x => profile.xp >= x.min) || levels[0];
    const next = levels.find(x => x.min > profile.xp);
    document.getElementById("rankName").textContent = isFounder ? "ОСНОВАТЕЛЬ WOAQUEZ" : level.name;
    document.getElementById("rankIcon").textContent = isFounder ? "👑" : level.icon;
    document.getElementById("rankDesc").textContent = isFounder ? "Эксклюзивный высший титул создателя сообщества WOAQUEZ." : level.desc;
    document.getElementById("xpLabel").textContent = profile.xp + " XP";
    document.getElementById("nextLevel").textContent = next ? "До «" + next.name + "»: " + (next.min-profile.xp) + " XP" : "Максимальный уровень";
    document.getElementById("xpFill").style.width = next ? Math.min(100,((profile.xp-level.min)/(next.min-level.min))*100) + "%" : "100%";
    const visiblePerks = isFounder ? [{icon:"👑",name:"ОСНОВАТЕЛЬ WOAQUEZ",desc:"Эксклюзивный титул для @woaquez.",min:0}, ...perks] : perks;
    document.getElementById("badgeCount").textContent = visiblePerks.filter(p => (isFounder && p.name === "ОСНОВАТЕЛЬ WOAQUEZ") || profile.xp >= p.min).length + " / " + visiblePerks.length;
    document.getElementById("perkList").innerHTML = visiblePerks.map(p => {
      const unlocked = (isFounder && p.name === "ОСНОВАТЕЛЬ WOAQUEZ") || profile.xp >= p.min;
      return '<div class="perk ' + (unlocked ? "" : "locked") + '"><div class="perk-icon">' + p.icon + '</div><div><strong>' + p.name + (unlocked ? " · Открыто" : "") + '</strong><small>' + p.desc + '</small></div></div>';
    }).join("");
  };
  const switchTab = tab => {
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    ["favorites","perks","games","cases"].forEach(name => document.getElementById(name+"Panel").hidden = name !== tab);
    const titles = {favorites:["Избранное.","Твоя личная коллекция находок."],perks:["Привилегии.","Повышай уровень и открывай новые статусы WOAQUEZ."],games:["Мини-игры.","Небольшие игры и XP — без ставок и покупок."],cases:["Кейсы.","Открывай бесплатные виртуальные подарки WOAQUEZ."]};
    document.getElementById("pageTitle").textContent = titles[tab][0];
    document.getElementById("pageIntro").textContent = titles[tab][1];
    if (tab === "perks") updatePerks();
    if (tab === "cases") renderGifts();
  };
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
  const today = () => new Date().toISOString().slice(0,10);
  const award = async amount => {
    if (profile.playedDay !== today()) { profile.playedDay = today(); profile.gamesToday = 0; }
    if (profile.gamesToday >= 2) return false;
    profile.xp += amount;
    profile.gamesToday += 1;
    await saveProfile();
    updatePerks();
    return true;
  };
  const caseCatalog = {
    starter:{name:"Starter Case",items:[["🧢","WOAQUEZ Cap","Обычный"],["🧥","Street Hoodie","Обычный"],["👟","Sneaker Tag","Необычный"],["🪙","Logo Coin","Обычный"]]},
    premium:{name:"Premium Case",items:[["💎","Crystal Badge","Редкий"],["🕶️","Night Glasses","Редкий"],["⌚","Urban Watch","Эпический"],["🎧","Sound Wave","Необычный"]]},
    exclusive:{name:"WOAQUEZ Exclusive",items:[["👑","Founder Crown","Особый"],["🏝️","Island Emblem","Эпический"],["🛡️","Elite Shield","Редкий"],["✨","Gold Signature","Особый"]]},
    legendary:{name:"Legendary Case",items:[["🌟","Golden Star","Легендарный"],["🐉","Dragon Relic","Легендарный"],["💠","Diamond Mark","Эпический"],["🚀","Orbit Trophy","Легендарный"]]}
  };
  const renderGifts = () => {
    const collection = Array.isArray(profile.gifts) ? profile.gifts : [];
    document.getElementById("giftCount").textContent = collection.length + " предметов";
    document.getElementById("giftCollection").innerHTML = collection.length ? collection.slice().reverse().map(g => '<div class="gift-item"><span>'+g.emoji+'</span><strong>'+g.name+'</strong><small>'+g.rarity+'</small></div>').join("") : '<div class="muted" style="grid-column:1/-1;text-align:center;padding:18px">Пока пусто — открой свой первый кейс.</div>';
    document.querySelectorAll("[data-case]").forEach(button => {
      const key = button.dataset.case;
      const used = profile.caseOpens && profile.caseOpens[today()] && profile.caseOpens[today()].includes(key);
      button.disabled = !!used;
      button.textContent = used ? "Уже открыт сегодня" : "Открыть бесплатно";
    });
  };
  document.querySelectorAll("[data-case]").forEach(button => button.addEventListener("click", async () => {
    const key = button.dataset.case;
    const def = caseCatalog[key];
    if (!def) return;
    if (!profile.caseOpens || typeof profile.caseOpens !== "object") profile.caseOpens = {};
    if (!profile.caseOpens[today()]) profile.caseOpens[today()] = [];
    if (profile.caseOpens[today()].includes(key)) return;
    const chosen = def.items[Math.floor(Math.random() * def.items.length)];
    const gift = {emoji:chosen[0],name:chosen[1],rarity:chosen[2],caseName:def.name,openedAt:Date.now()};
    profile.caseOpens[today()].push(key);
    if (!Array.isArray(profile.gifts)) profile.gifts = [];
    profile.gifts.push(gift);
    await saveProfile();
    document.getElementById("caseResult").innerHTML = '<div class="gift-result"><div class="eyebrow">'+def.name.toUpperCase()+'</div><div class="gift-emoji">'+gift.emoji+'</div><strong>'+gift.name+'</strong><div class="muted" style="margin-top:6px">'+gift.rarity+' · Добавлено в коллекцию</div></div>';
    renderGifts();
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
  }));
  const gameArea = document.getElementById("gameArea");
  const memoryStart = () => {
    const symbols = ["🧥","👟","🧢"];
    const deck = [...symbols,...symbols].sort(() => Math.random()-.5);
    let opened = [], matched = [], busy = false;
    let moves = 0;
    gameArea.innerHTML = '<div class="game-card"><div class="rank">Найди 3 пары</div><div class="muted">Открой две одинаковые карточки. Чем меньше ходов, тем лучше!</div><div class="game-board">' + deck.map((_,i)=>'<button class="game-cell" data-i="'+i+'">?</button>').join("") + '</div><div class="game-result" id="gameResult">Ходы: 0 · Найдено пар: 0/3</div><button class="primary-btn" id="restartMemory">Начать заново</button></div>';
    const result = document.getElementById("gameResult");
    const cells = [...gameArea.querySelectorAll(".game-cell")];
    const restart = () => memoryStart();
    document.getElementById("restartMemory").addEventListener("click",restart);
    cells.forEach((cell,i)=>cell.addEventListener("click",async()=>{
      if(busy || matched.includes(i) || opened.includes(i)) return;
      cell.textContent=deck[i]; cell.classList.add("open"); opened.push(i);
      if(opened.length===2){
        moves++; busy=true;
        const [a,b]=opened;
        if(deck[a]===deck[b]){
          matched.push(a,b); cells[a].classList.add("matched"); cells[b].classList.add("matched");
          opened=[]; busy=false;
          result.textContent="Ходы: "+moves+" · Найдено пар: "+(matched.length/2)+"/3";
          if(matched.length===6){
            const ok=await award(10);
            result.textContent=ok?"Все пары найдены! +10 XP 🎉":"Все пары найдены! Лимит XP на сегодня исчерпан.";
            if(tg && tg.HapticFeedback) try{tg.HapticFeedback.notificationOccurred("success")}catch(_){}
          }
        } else {
          result.textContent="Ходы: "+moves+" · Найдено пар: "+(matched.length/2)+"/3";
          setTimeout(()=>{[a,b].forEach(k=>{cells[k].textContent="?";cells[k].classList.remove("open")});opened=[];busy=false},650);
        }
      }
    }));
  };
  const quizStart = () => {
    const questions=[
      {q:"Как лучше всего проверить состояние вещи перед покупкой?",a:["Посмотреть только фото","Попросить дополнительные фото и описание","Сразу оплатить"],correct:1},
      {q:"Что важнее при выборе одежды?",a:["Только логотип","Состояние, размер и подлинность","Только цвет"],correct:1},
      {q:"Что стоит уточнить у продавца?",a:["Замеры и дефекты","Его пароль","Данные карты"],correct:0}
    ];
    let index=0,score=0;
    const show=()=>{
      if(index>=questions.length){
        gameArea.innerHTML='<div class="game-card"><div class="rank">Квиз завершён!</div><div class="game-result">Правильных ответов: '+score+'/3.</div><div class="muted">'+(score===3?"Отлично!":"Хорошая попытка — попробуй ещё раз.")+'</div><button class="primary-btn" id="againQuiz">Повторить</button></div>';
        document.getElementById("againQuiz").addEventListener("click",quizStart);
        if(score===3) award(8).then(ok=>{const el=gameArea.querySelector(".game-result");if(el)el.textContent+=" "+(ok?"+8 XP 🎉":"XP за игры на сегодня уже получен.");});
        return;
      }
      const item=questions[index];
      gameArea.innerHTML='<div class="game-card"><div class="eyebrow">ВОПРОС '+(index+1)+' / 3</div><div class="rank" style="font-size:17px;margin:8px 0">'+item.q+'</div>'+item.a.map((a,i)=>'<button class="answer" data-answer="'+i+'">'+a+'</button>').join("")+'<div class="game-result" id="quizResult"></div></div>';
      gameArea.querySelectorAll("[data-answer]").forEach(btn=>btn.addEventListener("click",()=>{
        const chosen=Number(btn.dataset.answer);
        gameArea.querySelectorAll("[data-answer]").forEach(b=>b.disabled=true);
        if(chosen===item.correct)score++;
        document.getElementById("quizResult").textContent=chosen===item.correct?"Верно!":"Не совсем. Правильный ответ: "+item.a[item.correct];
        setTimeout(()=>{index++;show()},850);
      }));
    };
    show();
  };
  document.querySelectorAll("[data-game]").forEach(b=>b.addEventListener("click",()=>b.dataset.game==="memory"?memoryStart():quizStart()));

  const params = new URLSearchParams(location.search);
  const id = params.get("save");
  (async () => {
    profile = await getProfile();
    items = await readAll();
    if (id && /^\d+$/.test(id)) {
      const item = {id, title:params.get("title") || "Объявление Kufar", city:params.get("city") || "Город не указан", price:params.get("price") || "Цена не указана", link:params.get("link") || ("https://www.kufar.by/item/" + id), image:params.get("image") || "", savedAt:Date.now()};
      if (/^https:\/\/www\.kufar\.by\/item\/\d+$/.test(item.link)) {
        await writeOne(item);
        items = await readAll();
        showNotice("✓ Объявление добавлено в твоё избранное");
        try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
      }
      history.replaceState({}, "", location.pathname);
    }
    render();
  })();
  filter.addEventListener("input", render);
  sort.addEventListener("change", render);
})();
</script>
</body>
</html>
